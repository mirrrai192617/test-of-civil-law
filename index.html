<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест по наследственному праву</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e8f0;--accent:#3559e0;--accent2:#2445bd;--green:#16834a;--greenbg:#e9f8ef;--red:#c8333d;--redbg:#fff0f0;--shadow:0 14px 40px #18264b12}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f4f6fb,#edf1fa);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{width:min(900px,100%);margin:auto;padding:28px 18px 50px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.brand small{display:block;color:var(--muted)}h1{font-size:clamp(25px,4vw,36px);line-height:1.15;margin:0 0 10px;letter-spacing:-.7px}h2{font-size:22px;line-height:1.3;margin:0 0 18px}.sub{color:var(--muted);margin:0 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:650;cursor:pointer;transition:.15s}.btn:focus-visible,input:focus-visible,.option:focus-within{outline:3px solid #9eb0ff;outline-offset:2px}.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent2)}.secondary{background:#eef1f8;color:var(--text)}.danger{background:#fff0f0;color:#a91e28}.btn:disabled{opacity:.45;cursor:not-allowed}.drop{border:1.5px dashed #b9c4df;background:#f9faff;border-radius:16px;padding:22px;text-align:center;margin:20px 0}.drop.drag{background:#edf1ff;border-color:var(--accent)}input[type=file]{max-width:100%;margin-top:10px}.hint{font-size:13px;color:var(--muted)}.history{margin-top:24px}.history table{width:100%;border-collapse:collapse;font-size:14px}.history th,.history td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}.history th{color:var(--muted);font-weight:600}.empty{color:var(--muted);padding:14px 0}.progress{height:7px;background:#e9edf6;border-radius:99px;overflow:hidden;margin:0 0 20px}.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}.qmeta{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}.question{font-size:clamp(19px,3vw,24px);font-weight:700;line-height:1.35;margin-bottom:22px}.options{display:grid;gap:10px}.option{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:white;transition:.15s}.option:hover{border-color:#aab7eb;background:#fafbff}.option input{margin-top:5px;accent-color:var(--accent);flex-shrink:0}.option.correct{border-color:var(--green);background:var(--greenbg)}.option.wrong{border-color:var(--red);background:var(--redbg)}.option.missed{border:2px solid var(--green);background:#f5fff8}.feedback{margin-top:16px;padding:13px 15px;border-radius:12px;background:#f4f6fb;color:#344054}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.score{font-size:52px;line-height:1.1;font-weight:800;letter-spacing:-2px}.grade{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:#e9edff;color:var(--accent);font-size:26px;font-weight:800;margin-right:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{background:#f7f8fc;border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{display:block;font-size:22px}.hidden{display:none!important}
@media(max-width:560px){.wrap{padding:18px 12px 32px}.card{border-radius:17px}.stats{grid-template-columns:1fr}.history{overflow-x:auto}.history table{min-width:470px}.actions .btn{flex:1}.brand{margin-bottom:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="logo">Н</div><div><strong>Учебный тренажёр</strong><small>Гражданское право · Наследование</small></div></div>
  <main id="app"></main>
  <p class="hint" style="text-align:center;margin-top:20px">Автономная страница · данные попыток хранятся только в этом браузере</p>
</div>
<script>
"use strict";
// Банк вопросов извлечён из прикреплённого документа. Неверные варианты добавлены для тренировки.
const BANK = [ { type: "multiple", question: "Наследник вправе отказаться от наследства", answers: ["в пользу других лиц из числа наследников по завещанию", "в пользу других лиц из числа наследников по закону любой очереди"]},
  { type: "single", question: "Наследниками 4 очереди являются", answers: ["родственники 3 степени родства"]},
  { type: "single", question: "Наследование между усыновлённым и его кровными родственниками", answers: ["не исключает наследования между усыновлённым и усыновителем"]},
  { type: "single", question: "Суд может освободить исполнителя завещания от его обязанностей", answers: ["по просьбе самого исполнителя завещания и по просьбе наследников при наличии обстоятельств, препятствующих исполнению гражданином этих обязанностей"]},
  { type: "multiple", question: "Завещание, отменённое последующим завещанием", answers: ["не восстанавливается, если последующее завещание отменено завещателем полностью или в соответствующей части", "подлежит исполнению, если последующее завещание признано недействительным"]},
  { type: "single", question: "Наследниками 3 очереди являются", answers: ["дяди и тёти наследодателя"]},
  { type: "multiple", question: "Исполнение завещания осуществляется", answers: ["исполнителем завещания (душеприказчиком)", "наследниками по завещанию"]},
  { type: "multiple", question: "Завещание по общему правилу является недействительным, в случае если", answers: ["не соблюдена письменная форма и требования к удостоверению завещания", "при составлении, подписании и удостоверении завещания не было свидетеля, если его присутствие является обязательным"]},
  { type: "multiple", question: "Согласно ГК, следующие граждане не могут наследовать по завещанию, если только оно не было составлено уже после утраты права наследования", answers: ["граждане, которые своими умышленными противоправными действиями, направленными против наследодателя, кого-либо из его наследников или против осуществления последней воли наследодателя, выраженной в завещании, способствовали либо пытались способствовать призванию их самих или других лиц к наследованию", "граждане, которые своими умышленными противоправными действиями, направленными против наследодателя, кого-либо из его наследников или против осуществления последней воли наследодателя, выраженной в завещании, способствовали или пытались способствовать увеличению причитающейся им или другим лицам доли наследства"]},
  { type: "multiple", question: "Нотариус вскрывает конверт с закрытым завещанием в присутствии", answers: ["не менее чем 2 свидетелей", "заинтересованных лиц из числа наследников по закону, пожелавших присутствовать"]},
  { type: "single", question: "Завещанием, совершённым в чрезвычайных обстоятельствах", answers: ["может быть отменено или изменено только завещание, совершённое в чрезвычайных обстоятельствах"]},
  { type: "text", question: "Лицо, которое подписывает завещание вместо завещателя в силу его физических недостатков, тяжёлой болезни или неграмотности, называется", answer: "рукоприкладчик"},
  { type: "single", question: "Доля наследника по закону, умершего до открытия наследства или одновременно с наследодателем", answers: ["переходит по праву представления к его соответствующим потомкам в случаях, предусмотренных ГК, и делится между ними поровну"]},
  { type: "multiple", question: "Днём открытия наследства может быть", answers: ["день предполагаемой гибели, указанный в решении суда об объявлении гражданина умершим", "день смерти гражданина", "день вступления в законную силу решения суда об объявлении гражданина умершим"]},
  { type: "single", question: "При составлении и нотариальном удостоверении завещания", answers: ["по желанию завещателя может присутствовать свидетель, который также подписывает завещание"]},
  { type: "single", question: "Полномочия исполнителя завещания удостоверяются", answers: ["свидетельством, выдаваемым нотариусом"]},
  { type: "multiple", question: "Условиями признания гражданина нетрудоспособным иждивенцем являются", answers: ["нахождение на иждивении не менее одного года до смерти наследодателя", "нетрудоспособность ко дню открытия наследства"]},
  { type: "multiple", question: "Наследниками по праву представления являются", answers: ["племянники и племянницы", "внуки наследодателя и их потомки", "двоюродные братья и сёстры наследодателя"]},
  { type: "multiple", question: "Наследник, пропустивший срок для принятия наследства, может обратиться в суд с требованием о восстановлении срока при следующих условиях", answers: ["наследник обратился в суд в течение 6 месяцев после того, как причины пропуска срока отпали", "наследник не знал и не должен был знать об открытии наследства", "срок был пропущен по уважительным причинам"]},
  { type: "single", question: "Родители усыновлённого и другие его родственники по происхождению по общему правилу", answers: ["не наследуют по закону после смерти усыновлённого и его потомства"]},
  { type: "single", question: "Наследование по праву представления имеет место", answers: ["в случаях, предусмотренных законом, если наследник умер до открытия наследства"]},
  { type: "multiple", question: "Отказ от наследства допускается только с предварительного разрешения органа опеки и попечительства в случае, когда наследником является", answers: ["несовершеннолетний гражданин", "ограниченно дееспособный", "недееспособный"]},
  { type: "multiple", question: "Осуществлять толкование завещания уполномочены", answers: ["исполнитель завещания", "нотариус", "суд"]},
  { type: "text", question: "Лица, не имеющие права наследовать или отстранённые от наследования в силу закона, называются", answer: "недостойные наследники"},
  { type: "single", question: "Если наследственное имущество переходит к двум или нескольким наследникам без указания наследуемого каждым из них конкретного имущества", answers: ["оно поступает в общую долевую собственность наследников со дня открытия наследства"]},
  { type: "text", question: "Обязание наследника или исполнителя завещания совершить какое-либо действие имущественного или неимущественного характера, направленное на осуществление общеполезной цели, называется", answer: "завещательное возложение"},
  { type: "single", question: "Если наследников несколько, свидетельство о праве на наследство может быть выдано", answers: ["всем наследникам совместно или по отдельности по их желанию"]},
  { type: "multiple", question: "Наследство может быть принято", answers: ["в течение 6 месяцев со дня вступления в законную силу решения суда об объявлении наследодателя умершим", "в течение 6 месяцев со дня открытия наследства"]},
  { type: "single", question: "На принятие наследства, в состав которого входит земельный участок", answers: ["не требуется специального разрешения"]},
  { type: "single", question: "Принадлежащие наследодателю ограниченно оборотоспособные вещи", answers: ["входят в состав наследства и наследуются на общих основаниях"]},
  { type: "single", question: "Свидетельство о праве на наследство выдаётся", answers: ["нотариусом по месту открытия наследства"]},
  { type: "single", question: "Если в состав наследства входит неделимая вещь, преимущественное право на её получение при разделе наследства имеет наследник, который", answers: ["обладал совместно с наследодателем правом общей собственности на данную вещь"]},
  { type: "text", question: "Указанный в завещании гражданин, которому поручено исполнение завещания независимо от того, является ли он наследником, называется", answer: "исполнитель завещания"},
  { type: "single", question: "Принятие наследства признаётся принадлежащим наследнику со дня", answers: ["открытия наследства независимо от времени его фактического принятия"]},
  { type: "text", question: "Указание в завещании другого наследника на случай, если назначенный им в завещании наследник умер до открытия наследства, называется", answer: "подназначение"},
  { type: "single", question: "Входящие в состав наследства наличные деньги", answers: ["вносятся в депозит нотариуса"]},
  { type: "single", question: "Входящие в состав наследства валютные ценности, драгоценные металлы и камни, изделия из них и не требующие управления ценные бумаги", answers: ["передаются банку на хранение"]},
  { type: "multiple", question: "Завещание может быть удостоверено", answers: ["должностными лицами органов местного самоуправления и должностными лицами консульских учреждений Российской Федерации — когда право совершения нотариальных действий предоставлено законом", "служащим банка — в отношении средств на счёте наследодателя", "нотариусом — в отношении любого имущества наследодателя"]},
  { type: "multiple", question: "В состав наследства не входят", answers: ["Права и обязанности, неразрывно связанные с личностью наследодателя", "Личные неимущественные права", "Нематериальные блага"]},
  { type: "single", question: "Доля умершего супруга в наследстве", answers: ["входит в состав наследства и переходит к наследникам"]},
  { type: "multiple", question: "Наследники каждой последующей очереди призываются к наследованию", answers: ["все наследники предшествующих очередей отказались от наследства", "никто из наследников предшествующих очередей не принял наследства", "никто из наследников предшествующих очередей не имеет права наследовать"]},
  { type: "multiple", question: "Наследники второй очереди", answers: ["бабушки и дедушки", "братья и сёстры"]},
  { type: "single", question: "При отсутствии других наследников по закону в качестве 8-й очереди", answers: ["нетрудоспособные иждивенцы"]},
  { type: "single", question: "Родитель усыновлённого или другие родственники по происхождению наследуют после усыновлённого в случае, если", answers: ["сохранили отношения с усыновлённым по решению суда"]},
  { type: "single", question: "Завещание, совершённое в чрезвычайных обстоятельствах в простой письменной форме, утрачивает силу, если завещатель не воспользуется возможностью совершить завещание в какой-либо иной форме, предусмотренной ГК РФ", answers: ["в течение месяца после прекращения этих обстоятельств"]},
  { type: "single", question: "Последняя воля гражданина в отношении своего имущества, если он находится в положении, явно угрожающем его жизни, и в силу сложившихся чрезвычайных обстоятельств лишён возможности совершить завещание в соответствии с обычными правилами, признаётся завещанием, если она выражена", answers: ["в простой письменной форме, собственноручно, в присутствии двух свидетелей"]},
  { type: "single", question: "Завещатель может распорядиться", answers: ["своим имуществом или какой-либо его частью, составив одно или несколько завещаний"]},
  { type: "single", question: "Завещатель вправе совершить завещание, содержащее распоряжение", answers: ["о любом имуществе, в том числе о том, которое он может приобрести в будущем"]},
  { type: "single", question: "Свидетельство о праве на наследство выдаётся", answers: ["по месту открытия наследства нотариусом или уполномоченным в соответствии с законом совершать такое нотариальное действие должностным лицом"]},
  { type: "single", question: "Наследство, по общему правилу, может быть принято в течение", answers: ["шести месяцев со дня открытия наследства"]},
  { type: "multiple", question: "По заявлению наследника, пропустившего срок для принятия наследства, суд может", answers: ["Восстановить этот срок", "Признать наследника принявшим наследство"]},
  { type: "multiple", question: "Местом открытия наследства в РФ, в зависимости от места жительства наследодателя и состава его имущества, может являться", answers: ["Последнее место жительства наследодателя", "Место нахождения такого наследственного имущества в РФ", "Место нахождения входящей в состав наследственного имущества недвижимости или наиболее ценной части этого недвижимого имущества в РФ", "Место нахождения движимого имущества или наиболее ценной части в РФ"]},
  { type: "multiple", question: "Согласие гражданина быть исполнителем завещания может быть выражено", answers: ["Путём совершения его собственноручной надписи на самом завещании", "В заявлении, приложенном к завещанию", "Путём подачи нотариусу отдельного заявления в течение месяца со дня открытия наследства", "Посредством фактического осуществления исполнения завещания в течение месяца со дня открытия наследства"]},
  { type: "single", question: "Доля наследодателя в общем имуществе члена КФХ", answers: ["Считается равной доле других членов хозяйства, если соглашением наследника с членами хозяйства не установлено иное"]},
  { type: "single", question: "Нетрудоспособными иждивенцами наследодателя являются", answers: ["нетрудоспособные наследники, находившиеся на иждивении наследодателя не менее одного года до его смерти"]},
  { type: "single", question: "Доли наследников по закону одной очереди равны, за исключением призвания к наследованию наследников", answers: ["по праву представления"]},
  { type: "single", question: "Наследник вправе отказаться от наследства в течение", answers: ["срока, установленного для принятия наследства, в том числе в случае, когда он уже принял наследство"]},
  { type: "single", question: "Наследники каждой последующей очереди наследуют при условии, если", answers: ["нет наследников предшествующих очередей"]},
  { type: "multiple", question: "Считается, что наследник принял наследство, если он", answers: ["произвёл за свой счёт расходы на содержание наследственного имущества", "вступил во владение или в управление наследственным имуществом", "принял меры по сохранению наследственного имущества, защите его от посягательств или притязаний третьих лиц", "оплатил за свой счёт долги наследодателя или получил от третьих лиц причитающиеся наследодателю денежные средства"]},
  { type: "single", question: "В случае смерти лица, имевшего право на принятие наследства в порядке наследственной трансмиссии, это право", answers: ["не входит в состав наследства, открывшегося после смерти такого лица"]},
  { type: "multiple", question: "Принять наследство может", answers: ["сам наследник", "законный представитель наследника", "представитель наследника по доверенности, если в доверенности специально указано такое право"]},
  { type: "multiple", question: "К лицам, которые не могут наследовать по праву представления, относятся потомки", answers: ["наследника по закону, лишённого наследодателем наследства", "недостойного наследника"]},
  { type: "single", question: "Имущество (жилое помещение), предоставленное наследодателю государством на льготных условиях", answers: ["входит в состав наследства и наследуется на общих основаниях"]},
  { type: "multiple", question: "Банки по вкладам или счетам, на которых находятся денежные средства наследодателя, обязаны предоставить средства на его достойные похороны", answers: ["лицу, указанному в постановлении нотариуса о выдаче денежных средств", "наследнику, которому завещаны эти денежные средства"]},
  { type: "single", question: "При возникновении права на наследство в силу отказа другого наследника от наследства или признания его недостойным наследником наследство может быть принято в течение", answers: ["6 месяцев"]},
  { type: "single", question: "В случае если наследник не принял наследство или был отстранён от наследования, по общему правилу причитавшаяся ему часть наследства", answers: ["переходит к наследникам по закону, призванным к наследованию, пропорционально их наследственным долям"]},
  { type: "single", question: "При удостоверении завещания нотариус обязан разъяснить завещателю положения закона о", answers: ["праве на обязательную долю в наследстве"]},
  { type: "multiple", question: "Завещание должно быть (выберите два верных варианта)", answers: ["записано со слов завещателя нотариусом и подписано другим гражданином по просьбе завещателя в присутствии нотариуса, в случаях, когда завещатель не в состоянии это сделать", "написано и подписано завещателем собственноручно"]},
  { type: "text", question: "Переход имущества умершего к другим лицам в порядке универсального правопреемства называется", answer: "наследование"},
  { type: "text", question: "Правопреемство при наследовании, когда имущество переходит в неизменном виде как единое целое, является", answer: "универсальным"}
];
const HISTORY_KEY = "inheritanceQuizHistory_v1";
const $ = s => document.querySelector(s);
const app = $("#app");
let questions = [], index = 0, answers = [], checked = false, score = 0, attemptBank = BANK;
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function history(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]")}catch{return []}}
function saveHistory(item){const h=history();h.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,10)))}
function renderStart(){
 const h=history();
 app.innerHTML=`<section class="card"><h1>Тест по наследственному праву</h1><p class="sub">Проверьте знания по вопросам из предоставленного файла. В каждом вопросе может быть один или несколько правильных ответов.</p>
 <div class="row"><div><strong><span id="bankCount">${BANK.length}</span> вопросов в банке</strong><div class="hint">Вопросы и варианты перемешиваются при каждой попытке.</div>
 <label for="questionCount" style="display:block;margin-top:14px;font-weight:650">Сколько вопросов пройти?</label><select id="questionCount" style="margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--text);font:inherit;max-width:100%"></select>
 </div><button class="btn primary" id="start">Начать тест</button></div>
 <div class="history"><div class="row"><h2 style="font-size:18px;margin:0">История попыток</h2><button class="btn secondary" id="clear" ${h.length?'':'disabled'}>Очистить историю</button></div>
 ${h.length?`<table><thead><tr><th>Дата и время</th><th>Результат</th><th>Процент</th><th>Оценка</th></tr></thead><tbody>${h.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.correct} / ${x.total}</td><td>${x.percent}%</td><td>${x.grade}</td></tr>`).join("")}</tbody></table>`:'<p class="empty">Пока нет завершённых попыток.</p>'}</div>
 <div class="drop" id="drop"><strong>Есть другой файл с вопросами?</strong><div class="hint">Можно загрузить .txt с вопросами и ответами: вопрос отдельной строкой, правильные ответы — следующими строками, блоки разделены пустой строкой.</div><input type="file" id="file" accept=".txt,text/plain"><div id="filemsg" class="hint"></div></div>
 <p class="hint">Оценка: 90–100% — 5; 75–89% — 4; 60–74% — 3; менее 60% — 2.</p></section>`;
 populateQuestionCounts(BANK.length);
 $("#start").onclick=()=>start(BANK, Number($("#questionCount").value));
 $("#clear").onclick=()=>{if(confirm("Удалить историю всех попыток?")){localStorage.removeItem(HISTORY_KEY);renderStart()}};
 const drop=$("#drop"), file=$("#file");
 file.onchange=()=>loadText(file.files[0]);
 drop.ondragover=e=>{e.preventDefault();drop.classList.add("drag")};drop.ondragleave=()=>drop.classList.remove("drag");
 drop.ondrop=e=>{e.preventDefault();drop.classList.remove("drag");if(e.dataTransfer.files[0])loadText(e.dataTransfer.files[0])};
}
function populateQuestionCounts(total, preferred){
 const select=$("#questionCount");
 if(!select)return;
 const counts=[10,15,20,25,30,35].filter(n=>n<total);
 counts.push(total);
 const unique=[...new Set(counts)];
 select.innerHTML=unique.map(n=>`<option value="${n}">${n===total?`Все вопросы (${n})`:`${n} вопросов`}</option>`).join("");
 const wanted=preferred && unique.includes(preferred)?preferred:(unique.includes(10)?10:total);
 select.value=String(wanted);
 $("#bankCount").textContent=total;
}
function loadText(file){
 if(!file)return;
 if(!file.name.toLowerCase().endsWith(".txt")){$("#filemsg").textContent="Пожалуйста, выберите файл .txt.";return}
 const reader=new FileReader();
 reader.onload=()=>{const parsed=parseText(String(reader.result||""));if(!parsed.length){$("#filemsg").textContent="Не удалось найти вопросы. Проверьте формат файла.";return}attemptBank=parsed;populateQuestionCounts(parsed.length);$("#filemsg").textContent=`Загружено вопросов: ${parsed.length}. Выберите количество и нажмите «Начать тест».`;$("#start").onclick=()=>start(parsed, Number($("#questionCount").value))};
 reader.onerror=()=>$("#filemsg").textContent="Не удалось прочитать файл.";
 reader.readAsText(file,"UTF-8");
}
function parseText(text){
 const blocks=text.replace(/\r/g,"").split(/\n\s*\n/);const out=[];
 for(const block of blocks){const lines=block.split("\n").map(s=>s.trim()).filter(Boolean);if(lines.length<2)continue;
 let q=lines[0].replace(/^\d+[\.)]\s*/,"");let a=lines.slice(1).map(s=>s.replace(/^[-•]\s*/,"")).filter(Boolean);
 if(q&&a.length){const wrong=["Только по решению суда при согласии всех наследников","Исключительно в пользу государства","Только после истечения трёх лет со дня открытия наследства"];out.push({q,a,wrong})}}
 return out;
}
let attemptCount = BANK.length;
function start(bank, requestedCount){
 attemptBank=bank;
 attemptCount=Math.max(1,Math.min(bank.length,Number(requestedCount)||bank.length));
 const selectedQuestions=shuffle(bank).slice(0,attemptCount);
 questions=selectedQuestions.map(q=>({...q,options:shuffle([...q.a.map(t=>({text:t,correct:true})),...q.wrong.slice(0,3).map(t=>({text:t,correct:false}))])}));
 index=0;answers=[];checked=false;score=0;renderQuestion();
}
function renderQuestion(){
 const q=questions[index];answers[index]=answers[index]||[];
 app.innerHTML=`<section class="card"><div class="progress"><span style="width:${(index/questions.length)*100}%"></span></div><div class="qmeta">Вопрос ${index+1} из ${questions.length}</div><div class="question">${esc(q.q)}</div>
 <div class="hint" style="margin-bottom:12px">Выберите ${q.a.length>1?"все правильные ответы":"один правильный ответ"}.</div>
 <div class="options">${q.options.map((o,i)=>{const chosen=answers[index].includes(i);let cls=checked?(o.correct?(chosen?"correct":"missed"):(chosen?"wrong":"")):"";return `<label class="option ${cls}"><input type="${q.a.length>1?'checkbox':'radio'}" name="answer" value="${i}" ${chosen?'checked':''} ${checked?'disabled':''}><span>${esc(o.text)}</span></label>`}).join("")}</div>
 ${checked?`<div class="feedback">${isCorrect(q,answers[index])?"Верно! Все правильные варианты выбраны.":"Ответ не полностью верный. Зелёным отмечены правильные варианты, красным — выбранные неверные."}</div>`:""}
 <div class="actions"><button class="btn secondary" id="exit">В меню</button><button class="btn primary" id="action">${checked?(index===questions.length-1?"Завершить тест":"Следующий вопрос"):"Проверить"}</button></div></section>`;
 $("#exit").onclick=renderStart;
 document.querySelectorAll('input[name="answer"]').forEach(inp=>inp.onchange=()=>{if(checked)return;const n=Number(inp.value);if(q.a.length>1){if(inp.checked&&!answers[index].includes(n))answers[index].push(n);if(!inp.checked)answers[index]=answers[index].filter(x=>x!==n)}else answers[index]=[n]});
 $("#action").onclick=()=>{if(!checked){if(!answers[index].length){alert("Сначала выберите ответ.");return}checked=true;if(isCorrect(q,answers[index]))score++;renderQuestion()}else if(index<questions.length-1){index++;checked=false;renderQuestion()}else finish()};
}
function isCorrect(q,selected){const right=q.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);return right.length===selected.length&&right.every(i=>selected.includes(i))}
function finish(){
 const total=questions.length, percent=Math.round(score/total*100), grade=percent>=90?5:percent>=75?4:percent>=60?3:2;
 const date=new Date().toLocaleString("ru-RU");saveHistory({date,correct:score,total,percent,grade});
 app.innerHTML=`<section class="card"><div class="qmeta">Тест завершён</div><h1>Ваш результат</h1><p class="sub">Попытка сохранена в истории этого браузера.</p><div class="row" style="justify-content:flex-start;gap:18px"><div class="score">${percent}%</div><div><div class="hint">Оценка</div><div style="display:flex;align-items:center;margin-top:4px"><span class="grade">${grade}</span><strong>${grade===5?"Отлично":grade===4?"Хорошо":grade===3?"Удовлетворительно":"Нужно повторить материал"}</strong></div></div></div>
 <div class="stats"><div class="stat"><span class="hint">Правильных ответов</span><b>${score} из ${total}</b></div><div class="stat"><span class="hint">Процент</span><b>${percent}%</b></div><div class="stat"><span class="hint">Дата попытки</span><b style="font-size:16px">${esc(date)}</b></div></div>
 <div class="actions"><button class="btn secondary" id="menu">На главную</button><button class="btn primary" id="again">Пройти ещё раз</button></div></section>`;
 $("#menu").onclick=renderStart;$("#again").onclick=()=>start(attemptBank, attemptCount);
}
renderStart();
</script>
</body>
</html>
